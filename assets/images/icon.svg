<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="traceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="100" height="100" rx="22" fill="#0B1120" />

  <!-- Keeper: 等距透视盒 -->
  <g stroke="#1E293B" stroke-width="2" fill="none" stroke-linejoin="round">
    <path d="M 50 16 L 80 33 L 80 67 L 50 84 L 20 67 L 20 33 Z" />
    <path d="M 20 33 L 50 50 L 80 33" />
    <path d="M 50 50 L 50 84" />
  </g>

  <!-- Trace: 数据追踪链路 -->
  <path d="M 20 67 L 20 33 L 50 50 L 50 16 L 80 33 L 80 67"
        stroke="url(#traceGrad)" stroke-width="7" fill="none"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- 光晕 -->
  <circle cx="20" cy="67" r="9" fill="#0ea5e9" opacity="0.25" />
  <circle cx="80" cy="67" r="9" fill="#d946ef" opacity="0.25" />

  <!-- 节点 -->
  <circle cx="20" cy="67" r="4.5" fill="#0ea5e9" />
  <circle cx="20" cy="33" r="3" fill="#ffffff" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
  <circle cx="50" cy="16" r="3" fill="#ffffff" />
  <circle cx="80" cy="33" r="3" fill="#ffffff" />
  <circle cx="80" cy="67" r="4.5" fill="#d946ef" />
</svg>
