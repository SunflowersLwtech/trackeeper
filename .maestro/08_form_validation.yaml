appId: host.exp.Exponent
---
# Test: Create Request Form Validation
# Verifies that submitting with empty/invalid fields shows validation errors.
#
# Requires: node scripts/maestro-input-server.js on port 4567.

- stopApp
- clearState
- openLink: "exp://localhost:8083"

- extendedWaitUntil:
    visible: "TracKeeper"
    timeout: 45000

- tapOn:
    point: "88%,40%"
    optional: true
- waitForAnimationToEnd

# --- Login as tenant ---
- runScript:
    file: set-clipboard.js
    env:
      CLIPBOARD_TEXT: "testtenant@trackeeper.test"
- tapOn:
    id: "login-email-input"
- waitForAnimationToEnd
- longPressOn:
    id: "login-email-input"
- tapOn: "Paste"
- waitForAnimationToEnd
- tapOn:
    text: "Allow Paste"
    optional: true

- runScript:
    file: set-clipboard.js
    env:
      CLIPBOARD_TEXT: "Test123456"
- tapOn:
    id: "login-password-input"
- waitForAnimationToEnd
- longPressOn:
    id: "login-password-input"
- tapOn: "Paste"
- waitForAnimationToEnd
- tapOn:
    text: "Allow Paste"
    optional: true

- tapOn:
    id: "login-submit-button"

- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "My Requests"
    timeout: 20000

# --- Navigate to create ---
- tapOn:
    text: "New Request"
    retryTapIfNoChange: true
    optional: true
- tapOn:
    point: "50%,94%"
    optional: true
- waitForAnimationToEnd

# --- Submit with empty form ---
- scrollUntilVisible:
    element:
      id: "create-request-submit-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "create-request-submit-button"

# Should see validation error toast
- extendedWaitUntil:
    visible: "Validation Error"
    timeout: 5000

# --- Enter only a short title (< 5 chars) ---
- runScript:
    file: set-clipboard.js
    env:
      CLIPBOARD_TEXT: "Hi"
- tapOn:
    id: "create-request-title-input"
- waitForAnimationToEnd
- longPressOn:
    id: "create-request-title-input"
- tapOn: "Paste"
- waitForAnimationToEnd
- tapOn:
    text: "Allow Paste"
    optional: true

# Submit again
- scrollUntilVisible:
    element:
      id: "create-request-submit-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "create-request-submit-button"

# Should still show validation error
- extendedWaitUntil:
    visible: "Validation Error"
    timeout: 5000
