appId: host.exp.Exponent
---
# Test: Manager views dashboard and assigns a request
# Requires a submitted request to exist.
#
# Uses simulator clipboard + native Paste workaround for iOS 26.2.
# Requires: node scripts/maestro-input-server.js on port 4567.

- stopApp
- clearState
- openLink: "exp://localhost:8083"

- extendedWaitUntil:
    visible: "TracKeeper"
    timeout: 45000

# Dismiss dev menu overlay if present
- tapOn:
    point: "88%,40%"
    optional: true
- waitForAnimationToEnd

# --- Login as manager ---
- runScript:
    file: set-clipboard.js
    env:
      CLIPBOARD_TEXT: "testmanager@trackeeper.test"
- tapOn:
    id: "login-email-input"
- waitForAnimationToEnd
- longPressOn:
    id: "login-email-input"
- tapOn: "Paste"
- waitForAnimationToEnd
- tapOn:
    text: "Allow Paste"
    optional: true

- runScript:
    file: set-clipboard.js
    env:
      CLIPBOARD_TEXT: "Test123456"
- tapOn:
    id: "login-password-input"
- waitForAnimationToEnd
- longPressOn:
    id: "login-password-input"
- tapOn: "Paste"
- waitForAnimationToEnd
- tapOn:
    text: "Allow Paste"
    optional: true

- tapOn:
    id: "login-submit-button"

# Dismiss "Save Password?" dialog
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 20000
- assertVisible: "Dashboard"

# Should see stats bar
- assertVisible: "Total"

# Tap on a request card
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- tapOn:
    id: "request-card-Kitchen faucet leaking badly"
- assertVisible: "Manage Request"

# Start assignment flow
- tapOn:
    id: "assign-request-button"

# Should see maintainer list
- assertVisible: "Select Maintainer"
- tapOn: "Test Maintainer"

# Confirm assignment
- tapOn:
    id: "confirm-assignment-button"

# Should see success
- extendedWaitUntil:
    visible: "Request assigned to Test Maintainer"
    timeout: 10000
