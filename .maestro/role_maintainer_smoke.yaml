appId: ${APP_ID}
---
- stopApp
- clearState
- openLink: ${EXPO_LINK}

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000

- tapOn:
    point: "88%,40%"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: "login-demo-maintainer"
- tapOn:
    text: "SIGN IN"

- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "My Tasks"
    timeout: 45000
- assertVisible: "My Tasks"

- tapOn:
    point: "83%,95%"
- extendedWaitUntil:
    visible: "MAINTAINER"
    timeout: 15000
- assertVisible:
    id: "profile-show-tutorial-button"
