appId: host.exp.Exponent
---
# Test: Tenant Login Flow
# Uses seeded test account on tracekeeper-51b4d
#
# Workaround for iOS 26.2: Maestro's inputText/pasteText do not deliver
# text to React Native TextInput. Instead we set the simulator clipboard
# via an HTTP bridge server (scripts/maestro-input-server.js on port 4567)
# and trigger the native iOS Paste action via long-press.

# Force-stop and clear Expo Go state so we get a fresh login screen.
# Then re-open the project via deep link.
- stopApp
- clearState
- openLink: "exp://localhost:8083"

# Wait for bundle to load
- extendedWaitUntil:
    visible: "TracKeeper"
    timeout: 45000

# Dismiss Expo dev menu overlay if present
- tapOn:
    point: "88%,40%"
    optional: true
- waitForAnimationToEnd

# Should see login screen
- assertVisible: "TracKeeper"

# --- Enter email ---
- runScript:
    file: set-clipboard.js
    env:
      CLIPBOARD_TEXT: "testtenant@trackeeper.test"
- tapOn:
    id: "login-email-input"
- waitForAnimationToEnd
- longPressOn:
    id: "login-email-input"
- tapOn: "Paste"
- waitForAnimationToEnd
- tapOn:
    text: "Allow Paste"
    optional: true

# --- Enter password ---
- runScript:
    file: set-clipboard.js
    env:
      CLIPBOARD_TEXT: "Test123456"
- tapOn:
    id: "login-password-input"
- waitForAnimationToEnd
- longPressOn:
    id: "login-password-input"
- tapOn: "Paste"
- waitForAnimationToEnd
- tapOn:
    text: "Allow Paste"
    optional: true

# Submit
- tapOn:
    id: "login-submit-button"

# Dismiss "Save Password?" dialog if it appears (iOS keychain prompt)
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd

# Wait for auth + navigation
- extendedWaitUntil:
    visible: "My Requests"
    timeout: 20000

- assertVisible: "My Requests"
